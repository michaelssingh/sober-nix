app = "sober-clare"
primary_region = "ewr"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "soju_data"
  destination = "/var/lib/soju"

[vm]
  cpu_kind = "shared"
  cpus = 2
  memory_mb = 1024

[[services]]
  protocol = "tcp"
  internal_port = 6697
  [[services.ports]]
    port = 6697

[[services]]
  protocol = "tcp"
  internal_port = 8080
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[services]]
  protocol = "tcp"
  internal_port = 8081
  [[services.ports]]
    port = 8081
    handlers = ["tls", "http"]

