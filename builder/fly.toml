app = "sober-services"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "nix_data"
  destination = "/var/lib/nix_persist"

[vm]
  cpu_kind = "performance"
  cpus = 8
  memory_mb = 16384

[[services]]
  protocol = "tcp"
  internal_port = 2222
  [[services.ports]]
    port = 22

[[services]]
  protocol = "udp"
  internal_port = 51820
  [[services.ports]]
    port = 51820
