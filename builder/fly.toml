app = "sober-services"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "nix_data"
  destination = "/var/lib/nix_persist"

[vm]
  cpu_kind = "shared"
  cpus = 4
  memory_mb = 4096

[[services]]
  protocol = "tcp"
  internal_port = 2222
  [[services.ports]]
    port = 22

[[services]]
  protocol = "tcp"
  internal_port = 8080
  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[services]]
  protocol = "udp"
  internal_port = 51820
  [[services.ports]]
    port = 51820
